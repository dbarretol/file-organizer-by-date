[package]
name = "file-organizer-by-date"
version = "0.6.0"
edition = "2021"
rust-version = "1.82"
description = "Organize files into year/month/day folders by date, with a preview first, no overwrites and undo"
license = "MIT"
repository = "https://github.com/dbarretol/file-organizer-by-date"
homepage = "https://github.com/dbarretol/file-organizer-by-date"
readme = "README.md"
keywords = ["files", "organizer", "date", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
